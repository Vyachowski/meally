version: 2

# Minor and patch updates arrive grouped — one pull request per ecosystem per
# week — and are merged automatically once CI is green (see
# .github/workflows/dependabot-auto-merge.yml). Major bumps are deliberately
# left out of the groups so they arrive on their own and get read.
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bundler:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
