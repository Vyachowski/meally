name: Dependabot auto-merge

# Enables auto-merge on Dependabot pull requests that are not major bumps.
# Auto-merge waits for the required checks in the `main` ruleset, so this
# does not bypass CI — it only removes the final click once CI is green.
#
# Major bumps are deliberately excluded: they arrive as their own pull request
# and are merged by hand.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # NOTE: this workflow deliberately does not check out the pull request's
      # code. `pull_request_target` runs with write permissions against the base
      # repository, so running code from the branch would be a privilege
      # escalation. Metadata only.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
