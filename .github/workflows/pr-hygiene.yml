name: PR hygiene

# The commit-msg hook covers commit messages; hooks cannot see a PR body.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr_body:
    runs-on: ubuntu-latest

    steps:
      - name: Reject AI attribution in the pull request body
        # Via env, not interpolation: the body is attacker-controlled.
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE 'co-authored-by:.*(claude|copilot|cursor|chatgpt|openai|gemini|codex|devin|aider)|generated (with|by).*(claude|copilot|cursor|chatgpt)|🤖'; then
            echo "::error::The pull request body contains AI attribution. Remove the trailer, the generated-with footer, or the robot emoji."
            exit 1
          fi
          echo "No AI attribution found."
